name = "sefershare1"
compatibility_date = "2024-09-23"

# Serve the built SPA as static assets — no Worker script needed, so Wrangler
# doesn't attempt to auto-wire a Vite/Workers integration (which requires
# Vite 6+; this project is still on Vite 5).
[assets]
directory = "dist"
not_found_handling = "single-page-application"
